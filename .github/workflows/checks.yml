name: songyuan device checks
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-songyuan.py
      - name: Compile and run existing touch and GPU host tests
        run: |
          mkdir -p build/host-tests
          for component in MyronTouchBoard MyronGpuBoard MyronGmu MyronCmdDb MyronHfi; do
            sources="package/${component}Tests.c"
            if test -f "package/${component}.c"; then sources="$sources package/${component}.c"; fi
            cc -std=c11 -Wall -Wextra -Werror -Ipackage $sources -o "build/host-tests/$component"
            "build/host-tests/$component"
          done
      - name: Check firmware pins
        run: python3 scripts/fetch-songyuan-gpu-firmware.py
      - name: Check the pinned Xiaomi GMU image
        run: build/host-tests/MyronGmu .cache/firmware/myron-gpu/gen80200_gmu.bin
